spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://localhost:5173"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true

          routes:
            - id: designation-master
              uri: lb://DESIGNATION-MASTER
              predicates:
                - Path=/designation/**

            - id: uploads-master
              uri: lb://DESIGNATION-MASTER
              predicates:
                - Path=/uploads/**

            - id: auth-service
              uri: lb://AUTH-SERVICE
              predicates:
                - Path=/auth/**

            - id: master-service
              uri: lb://MASTER-SERVICE
              predicates:
                - Path=/master/**

            - id: common-service
              uri: lb://COMMON-SERVICE
              predicates:
                - Path=/common/**

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET}
