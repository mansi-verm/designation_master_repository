
spring:
  application:
    name: auth-service

  config:
    import: "configserver:http://config-server:8888"

eureka:
  instance:
    hostname: auth-service
    prefer-ip-address: true

  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: false